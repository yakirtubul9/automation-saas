{% extends "base.html" %}
{% block title %}התחברות{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <div class="rounded-2xl border bg-white p-6 shadow-sm">
    <h1 class="text-xl font-semibold">התחברות</h1>
    <p class="mt-1 text-sm text-slate-500">התחבר כדי לנהל יומן ואוטומציות.</p>

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}

      <div class="space-y-2">
        <label class="text-sm font-medium">שם משתמש</label>
        {{ form.username }}
      </div>

      <div class="space-y-2">
        <label class="text-sm font-medium">סיסמה</label>
        {{ form.password }}
      </div>

      {% if form.non_field_errors %}
        <div class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">
          {{ form.non_field_errors }}
        </div>
      {% endif %}

      <button type="submit" class="w-full rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">
        התחבר
      </button>
    </form>
  </div>
</div>

<script>
  // Apply basic Tailwind classes to Django's default widgets
  (function() {
    var u = document.getElementById("id_username");
    var p = document.getElementById("id_password");
    var cls = "w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400";
    if (u) u.className = cls;
    if (p) p.className = cls;
  })();
</script>
{% endblock %}
