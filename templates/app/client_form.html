{% extends "base.html" %}
{% block title %}לקוח חדש{% endblock %}

{% block content %}
<div class="max-w-2xl space-y-5">
  <div>
    <h1 class="text-2xl font-semibold">לקוח חדש</h1>
    <p class="mt-1 text-sm text-slate-500">יצירת מטופל (לשימוש Provider / תפעול).</p>
  </div>

  <form method="post" class="rounded-2xl border bg-white p-5 space-y-4">
    {% csrf_token %}
    {% for field in form %}
      <div class="space-y-1">
        <label class="text-sm font-medium">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div class="text-sm text-rose-700">{{ field.errors }}</div>
        {% endif %}
      </div>
    {% endfor %}
    <div class="flex gap-2 pt-2">
      <button class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800" type="submit">שמור</button>
      <a href="{% url 'ui_clients' %}" class="rounded-xl border bg-white px-4 py-2 text-sm font-medium hover:bg-slate-50">חזרה</a>
    </div>
  </form>
</div>

<script>
  (function() {
    var fields = document.querySelectorAll("input, select, textarea");
    fields.forEach(function(el) {
      if (el.type === "hidden") return;
      el.classList.add("w-full","rounded-xl","border","border-slate-300","px-3","py-2","text-sm","focus:outline-none","focus:ring-2","focus:ring-slate-400");
    });
  })();
</script>
{% endblock %}
